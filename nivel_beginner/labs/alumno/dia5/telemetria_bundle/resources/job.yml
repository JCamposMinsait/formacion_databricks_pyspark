resources:
  jobs:
    telemetria_job:
      name: telemetria-eolica-job
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.email_alertas}
      # Disparo por llegada de ficheros (alternativa: schedule con cron)
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.ruta_landing}/
          min_time_between_triggers_seconds: 300
      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: esquema
          default: ${var.esquema}
      tasks:
        - task_key: preparar_maestros
          notebook_task:
            notebook_path: ../src/notebooks/01_preparar_maestros.py
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: pipeline_telemetria
          depends_on:
            - task_key: preparar_maestros
          pipeline_task:
            pipeline_id: ${resources.pipelines.telemetria_pipeline.id}
            full_refresh: false

        - task_key: control_calidad
          depends_on:
            - task_key: pipeline_telemetria
          notebook_task:
            notebook_path: ../src/notebooks/02_control_calidad.py

        # TODO (lab 5a, ejercicio 3): añade aquí dos tareas
        #   - hay_alertas: condition_task que compruebe {{tasks.control_calidad.values.alertas}} > 0
        #   - notificar_mantenimiento: notebook ../src/notebooks/03_notificar.py, solo si hay_alertas es true
